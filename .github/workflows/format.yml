name: format

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    container: ghcr.io/ocaml-tracing/ocaml-opentelemetry/ci-4.14:latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - run: opam exec -- make format-check
